[package]
name = "workbench"
version = "0.1.0"
description = "Windows application launcher"
edition = "2021"
rust-version = "1.90"
[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pinyin = "0.10"
nucleo-matcher = "0.3"
notify = "8"
sha2 = "0.10"
base64 = "0.22"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.6"
