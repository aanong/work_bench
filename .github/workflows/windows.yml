name: Windows checks and installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Parse the embedded Windows scanner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'src-tauri/src/scan.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Smoke-test Shell COM scanner
        shell: powershell
        run: |
          $env:WORKBENCH_ICON_DIR = Join-Path $env:RUNNER_TEMP 'workbench-icons'
          $env:WORKBENCH_SCAN_OUTPUT = Join-Path $env:RUNNER_TEMP 'workbench-scan.json'
          New-Item -ItemType Directory -Force $env:WORKBENCH_ICON_DIR | Out-Null
          $script = Get-Content -Raw ./src-tauri/src/scan.ps1
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
          & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -EncodedCommand $encoded
          if ($LASTEXITCODE -ne 0) { throw 'Shell COM scanner failed' }
          $apps = @(Get-Content -Raw $env:WORKBENCH_SCAN_OUTPUT | ConvertFrom-Json)
          if ($apps.Count -eq 0) { throw 'No Windows applications found' }
          foreach ($app in $apps) {
            if (!$app.id -or !$app.name -or !$app.target) { throw 'Invalid app record' }
          }
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Workbench-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
